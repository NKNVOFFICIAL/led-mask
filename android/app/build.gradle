plugins {
    id "com.android.application"
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace "com.ledmask.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.ledmask.app"
        minSdk 29
        targetSdk 34
        versionCode runNumber
        versionName "2.0.11." + runNumber
    }

    signingConfigs {
        release {
            storeFile file("ledmask-release.jks")
            storePassword "ledmask123"
            keyAlias "ledmask"
            keyPassword "ledmask123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
