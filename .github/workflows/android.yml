name: Android APK

# Собирает APK из index.html (та же программа, что и сайт) и выкладывает
# его в Releases → «android-latest» → LED-Mask-Android.apk.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Веб-версия внутрь приложения
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Сборка APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../LED-Mask-Android.apk

      - name: Публикация в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest LED-Mask-Android.apk \
            --title "LED Pixel Mask Generator для Android — сборка ${{ github.run_number }}" \
            --notes "Скачайте LED-Mask-Android.apk на телефон и установите (разрешите установку из этого источника). Файлы сохраняются в «Загрузки/LED Mask»." \
            --target "$GITHUB_SHA" --latest=false

      - name: Лог ошибки сборки
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-build-log --yes --cleanup-tag 2>/dev/null || true
          test -f build.log && gh release create android-build-log build.log --title "Лог неудачной сборки" --notes "Автоматический лог" --target "$GITHUB_SHA" --prerelease --latest=false || true
